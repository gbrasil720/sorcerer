name: Feature request
description: An idea for something Sorcerer should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or "what if…?" you were exploring and what got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: "Any shape is fine: a sentence, a sketch, a screenshot of another app."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Experiments and rounds
        - Characters and chat
        - Context and briefs
        - Branches and reports
        - AI providers and limits
        - Navigation and settings
        - Landing page
        - Something else
